<div class="h-full p-6 bg-[#F9F9F9] overflow-auto" *ngIf="!loading && envio">

  <!-- Breadcrumb -->
  <div class="text-sm text-gray-500 mb-1">
    <a [routerLink]="['/envios', idEnvio]" class="hover:text-[#B8672E]">{{ envio.numero_correlativo }}</a>
    <span class="mx-1">/</span>
    <span class="text-[#1F1F1F] font-medium">Programar</span>
  </div>

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-[#1F1F1F]">Programar Envío</h1>
      <p class="text-gray-600">Indica cuándo planeas despachar {{ envio.numero_correlativo }}</p>
    </div>
    <div class="flex space-x-3">
      <button (click)="onCancel()"
        class="px-4 py-2 border border-[#E5E5E5] rounded-lg text-[#1F1F1F] hover:bg-[#F3F2F1] transition flex items-center">
        Cancelar
      </button>
      <button (click)="onSave()" [disabled]="saving || !canSave()"
        class="px-4 py-2 bg-[#B8672E] text-white rounded-lg hover:bg-[#A67C52] transition flex items-center disabled:opacity-50">
        <lucide-icon [img]="Check" class="w-5 h-5 mr-2" />Guardar Programación
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-6">
      <div class="bg-white rounded-lg border border-[#E5E5E5] shadow-sm p-6">
        <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">Programación</h2>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 text-sm mb-1">Fecha programada *</label>
            <input type="date" [(ngModel)]="model.fecha_programada"
              class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#B8672E]" />
          </div>

          <div>
            <label class="block text-gray-700 text-sm mb-1">Medio de envío</label>
            <input type="text" [(ngModel)]="model.medio_envio" list="medios-envio-programar"
              placeholder="Ej: Olva Courier, InDriver..."
              class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#B8672E]" />
            <datalist id="medios-envio-programar">
              <option *ngFor="let m of mediosEnvioSugeridos" [value]="m"></option>
            </datalist>
          </div>
        </div>
      </div>
    </div>

    <div class="space-y-6">
      <div class="bg-white rounded-lg border border-[#E5E5E5] shadow-sm p-6">
        <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">Resumen</h2>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between">
            <span class="text-gray-500">Envío</span>
            <span class="font-medium text-[#1F1F1F]">{{ envio.numero_correlativo }}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500">Cliente</span>
            <span class="font-medium text-[#1F1F1F]">{{ (envio.paquete.id_cliente | UserNamePipe | async) || 'N/A' }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="loading" class="h-full flex items-center justify-center text-gray-500">Cargando...</div>
