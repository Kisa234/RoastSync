<div class="min-h-screen bg-[#FFF9EF] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-md w-full max-w-sm p-8 border border-[#E5E5E5]">

    <div class="flex justify-center mb-5">
      <div class="bg-[#FFEBD6] p-4 rounded-full">
        <lucide-angular [name]="Coffee" class="w-10 h-10 text-[#A67C52]"></lucide-angular>
      </div>
    </div>

    <h1 class="text-center text-xl font-semibold text-[#1F1F1F] mb-1">Restablecer contraseña</h1>
    <p class="text-center text-sm text-[#7A7A7A] mb-6">Ingresa tu nueva contraseña</p>

    <div *ngIf="tokenMissing" class="text-center text-red-500 text-sm">
      El enlace no es válido. Solicita uno nuevo desde la pantalla de inicio de sesión.
    </div>

    <div *ngIf="!tokenMissing && !success">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <label class="block text-sm font-medium text-[#1F1F1F] mb-1">Nueva contraseña</label>
        <div class="relative mb-1">
          <input [type]="showNewPassword ? 'text' : 'password'" formControlName="newPassword"
            placeholder="••••••"
            class="w-full px-4 py-2.5 rounded-lg bg-[#F9F9F9] border border-[#E5E5E5] text-sm
                   focus:outline-none focus:ring-2 focus:ring-[#B8672E] placeholder-gray-400 pr-10" />
          <button type="button" (click)="showNewPassword = !showNewPassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#B8672E] transition">
            <lucide-angular [name]="showNewPassword ? EyeOff : Eye" class="w-4 h-4"></lucide-angular>
          </button>
        </div>

        <label class="block text-sm font-medium text-[#1F1F1F] mb-1">Confirmar contraseña</label>
        <div class="relative mb-1">
          <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword"
            placeholder="••••••"
            class="w-full px-4 py-2.5 rounded-lg bg-[#F9F9F9] border border-[#E5E5E5] text-sm
                   focus:outline-none focus:ring-2 focus:ring-[#B8672E] placeholder-gray-400 pr-10" />
          <button type="button" (click)="showConfirmPassword = !showConfirmPassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#B8672E] transition">
            <lucide-angular [name]="showConfirmPassword ? EyeOff : Eye" class="w-4 h-4"></lucide-angular>
          </button>
        </div>

        <button type="submit" [disabled]="form.invalid || loading"
          class="w-full py-2.5 rounded-xl text-white font-medium text-sm mt-4
                 bg-gradient-to-r from-[#C8A88D] to-[#A67C52]
                 hover:opacity-90 transition disabled:opacity-40 disabled:cursor-not-allowed">
          {{ loading ? 'Actualizando...' : 'Restablecer contraseña' }}
        </button>
      </form>

      <div *ngIf="errorMsg" class="text-center text-red-500 text-sm mt-3">
        {{ errorMsg }}
      </div>
    </div>

    <div *ngIf="success" class="text-center text-sm text-green-700">
      Tu contraseña fue actualizada correctamente. Te llevaremos al inicio de sesión...
    </div>

    <div class="text-center mt-6">
      <a routerLink="/login" class="text-sm text-[#B8672E] hover:underline">Volver a iniciar sesión</a>
    </div>

  </div>
</div>
