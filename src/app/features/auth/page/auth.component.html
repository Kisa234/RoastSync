<div class="min-h-screen bg-[#FFF9EF] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-md w-full max-w-sm p-8 border border-[#E5E5E5]">

    <!-- Logo -->
    <div class="flex justify-center mb-5">
      <div class="bg-[#FFEBD6] p-4 rounded-full">
        <lucide-angular [name]="Coffee" class="w-10 h-10 text-[#A67C52]"></lucide-angular>
      </div>
    </div>

    <!-- Título -->
    <h1 class="text-center text-xl font-semibold text-[#1F1F1F] mb-1">Iniciar Sesión</h1>
    <p class="text-center text-sm text-[#7A7A7A] mb-6">Ingresa tu DNI y PIN</p>

    <!-- DNI -->
    <div [formGroup]="dniForm">
      <label for="dni" class="block text-sm font-medium text-[#1F1F1F] mb-1">DNI</label>
      <input id="dni" type="text" formControlName="documento_identidad"
        placeholder="12345678" maxlength="12"
        class="w-full px-4 py-2.5 rounded-lg bg-[#F9F9F9] border border-[#E5E5E5] text-sm
               focus:outline-none focus:ring-2 focus:ring-[#B8672E] placeholder-gray-400 mb-1" />
      <div *ngIf="dni.invalid && dni.touched" class="text-red-500 text-xs mb-2">
        Ingresa un DNI válido.
      </div>
    </div>

    <!-- Indicador PIN -->
    <div class="mt-4 mb-4">
      <label class="block text-sm font-medium text-[#1F1F1F] mb-3">PIN</label>
      <div class="flex justify-center gap-3">
        <div *ngFor="let i of [0,1,2,3,4,5]"
          class="w-10 h-10 rounded-full border-2 flex items-center justify-center transition-all"
          [ngClass]="pin.length > i
            ? 'border-[#B8672E] bg-[#B8672E]'
            : 'border-[#E5E5E5] bg-[#F9F9F9]'">
          <div *ngIf="pin.length > i" class="w-2.5 h-2.5 rounded-full bg-white"></div>
        </div>
      </div>
    </div>

    <!-- Teclado numérico shuffleado -->
    <div class="grid grid-cols-3 gap-2 mb-4">
      <ng-container *ngFor="let d of teclado; let i = index">
        <!-- Dígitos 0-8 en posiciones 0-8 -->
        <button *ngIf="i < 9" type="button" (click)="presionar(d)"
          class="h-12 rounded-xl text-lg font-semibold text-[#1F1F1F] bg-[#F9F9F9]
                 border border-[#E5E5E5] hover:bg-[#FFEBD6] hover:border-[#B8672E]
                 active:scale-95 transition-all select-none">
          {{ d }}
        </button>
      </ng-container>

      <!-- Fila inferior: vacío | último dígito | borrar -->
      <div></div>
      <button type="button" (click)="presionar(teclado[9])"
        class="h-12 rounded-xl text-lg font-semibold text-[#1F1F1F] bg-[#F9F9F9]
               border border-[#E5E5E5] hover:bg-[#FFEBD6] hover:border-[#B8672E]
               active:scale-95 transition-all select-none">
        {{ teclado[9] }}
      </button>
      <button type="button" (click)="borrar()"
        class="h-12 rounded-xl flex items-center justify-center bg-[#F9F9F9]
               border border-[#E5E5E5] hover:bg-red-50 hover:border-red-200
               active:scale-95 transition-all">
        <lucide-angular [name]="Delete" class="w-5 h-5 text-gray-500"></lucide-angular>
      </button>
    </div>

    <!-- Botón ingresar -->
    <button type="button" (click)="onSubmit()"
      [disabled]="dniForm.invalid || pin.length < 4 || loading"
      class="w-full py-2.5 rounded-xl text-white font-medium text-sm
             bg-gradient-to-r from-[#C8A88D] to-[#A67C52]
             hover:opacity-90 transition disabled:opacity-40 disabled:cursor-not-allowed">
      {{ loading ? 'Iniciando...' : 'Ingresar' }}
    </button>

    <!-- Error -->
    <div *ngIf="errorMsg" class="text-center text-red-500 text-sm mt-3">
      {{ errorMsg }}
    </div>

  </div>
</div>
