<div class="min-h-screen bg-[#FFF9EF] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-md w-full max-w-sm p-8 border border-[#E5E5E5]">

    <!-- Logo -->
    <div class="flex justify-center mb-5">
      <div class="bg-[#FFEBD6] p-4 rounded-full">
        <lucide-angular [name]="Coffee" class="w-10 h-10 text-[#A67C52]"></lucide-angular>
      </div>
    </div>

    <!-- Título -->
    <h1 class="text-center text-xl font-semibold text-[#1F1F1F] mb-1">Iniciar Sesión</h1>
    <p class="text-center text-sm text-[#7A7A7A] mb-6">Ingresa tu DNI y contraseña</p>

    <!-- DNI -->
    <div [formGroup]="dniForm" class="mb-4">
      <label for="dni" class="block text-sm font-medium text-[#1F1F1F] mb-1">DNI</label>
      <input id="dni" type="text" formControlName="documento_identidad" placeholder="12345678" maxlength="12"
        class="w-full px-4 py-2.5 rounded-lg bg-[#F9F9F9] border border-[#E5E5E5] text-sm
               focus:outline-none focus:ring-2 focus:ring-[#B8672E] placeholder-gray-400" />
      <div *ngIf="dni.invalid && dni.touched" class="text-red-500 text-xs mt-1">
        Ingresa un DNI válido.
      </div>
    </div>

    <!-- Contraseña -->
    <div class="mb-6">
      <label for="pin" class="block text-sm font-medium text-[#1F1F1F] mb-1">Contraseña</label>
      <div class="relative">
        <input id="pin" [type]="showPin ? 'text' : 'password'" [(ngModel)]="pin" maxlength="6" placeholder="••••••"
          class="w-full px-4 py-2.5 rounded-lg bg-[#F9F9F9] border border-[#E5E5E5] text-sm
                 focus:outline-none focus:ring-2 focus:ring-[#B8672E] placeholder-gray-400 pr-10" />
        <button type="button" (click)="showPin = !showPin"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#B8672E] transition">
          <lucide-angular [name]="showPin ? EyeOff : Eye" class="w-4 h-4"></lucide-angular>
        </button>
      </div>
    </div>

    <!-- Botón ingresar -->
    <button type="button" (click)="onSubmit()" [disabled]="dniForm.invalid || pin.length < 4 || loading"
      class="w-full py-2.5 rounded-xl text-white font-medium text-sm
             bg-gradient-to-r from-[#C8A88D] to-[#A67C52]
             hover:opacity-90 transition disabled:opacity-40 disabled:cursor-not-allowed">
      {{ loading ? 'Iniciando...' : 'Ingresar' }}
    </button>

    <!-- Olvidé mi contraseña -->
    <div class="text-center mt-4">
      <a routerLink="/forgot-password" class="text-xs text-[#B8672E] hover:underline">¿Olvidaste tu contraseña?</a>
    </div>

    <!-- Error -->
    <div *ngIf="errorMsg" class="text-center text-red-500 text-sm mt-3">
      {{ errorMsg }}
    </div>

  </div>
</div>
