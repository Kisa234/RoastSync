<div class="fixed inset-0 bg-opacity-50 backdrop-blur-md flex items-center justify-center z-10 p-4">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-md overflow-visible">

    <div class="flex justify-between items-center px-6 pt-4">
      <div>
        <h2 class="text-xl font-semibold text-[#1F1F1F]">Cambiar contraseña</h2>
        <p class="text-gray-600 text-sm">Ingresa tu contraseña actual y la nueva</p>
      </div>
      <button (click)="onCancel()" class="text-gray-400 hover:text-gray-600">
        <lucide-icon [img]="X" class="w-5 h-5"></lucide-icon>
      </button>
    </div>

    <div class="px-6 py-5">
      <form class="space-y-4">
        <div>
          <label class="block text-gray-700 text-sm mb-1">Contraseña actual</label>
          <div class="relative">
            <input [type]="showCurrentPassword ? 'text' : 'password'"
              [(ngModel)]="form.currentPassword" name="currentPassword"
              class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 pr-10 focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
            <button type="button" (click)="showCurrentPassword = !showCurrentPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#B8672E] transition">
              <lucide-icon [img]="showCurrentPassword ? EyeOff : Eye" class="w-4 h-4"></lucide-icon>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Nueva contraseña</label>
          <div class="relative">
            <input [type]="showNewPassword ? 'text' : 'password'"
              [(ngModel)]="form.newPassword" name="newPassword"
              class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 pr-10 focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
            <button type="button" (click)="showNewPassword = !showNewPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#B8672E] transition">
              <lucide-icon [img]="showNewPassword ? EyeOff : Eye" class="w-4 h-4"></lucide-icon>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Confirmar nueva contraseña</label>
          <div class="relative">
            <input [type]="showConfirmPassword ? 'text' : 'password'"
              [(ngModel)]="form.confirmNewPassword" name="confirmNewPassword"
              class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 pr-10 focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
            <button type="button" (click)="showConfirmPassword = !showConfirmPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#B8672E] transition">
              <lucide-icon [img]="showConfirmPassword ? EyeOff : Eye" class="w-4 h-4"></lucide-icon>
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="flex justify-end items-center px-6 py-4 border-t border-[#E5E5E5] space-x-2">
      <button (click)="onCancel()" class="px-4 py-2 rounded border border-[#A67C52] hover:bg-[#F3F2F1]">
        Cancelar
      </button>
      <button (click)="save()" [disabled]="isButtonDisabled()"
        class="px-4 py-2 rounded bg-[#B8672E] text-white hover:bg-[#A67C52] flex items-center"
        [class.opacity-50]="isButtonDisabled()">
        <lucide-icon [img]="KeyRound" class="w-5 h-5 mr-2"></lucide-icon>
        {{ saving ? 'Actualizando...' : 'Actualizar' }}
      </button>
    </div>

  </div>
</div>
