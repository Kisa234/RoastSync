<div class="h-full p-6 bg-[#F9F9F9] overflow-auto" *ngIf="row">

  <!-- Breadcrumb -->
  <div class="text-sm text-gray-500 mb-1">
    <a routerLink="/inventory/actualizar" class="hover:text-[#B8672E]">Actualizar Inventario</a>
    <span class="mx-1">/</span>
    <span class="text-[#1F1F1F] font-medium">Trasladar Stock</span>
  </div>

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-[#1F1F1F]">Trasladar Stock</h1>
      <p class="text-gray-600">Mueve stock de {{ row.displayName }} entre almacenes</p>
    </div>
    <div class="flex space-x-3">
      <button (click)="onCancel()"
        class="px-4 py-2 border border-[#E5E5E5] rounded-lg text-[#1F1F1F] hover:bg-[#F3F2F1] transition flex items-center">
        Cancelar
      </button>
      <button (click)="onSave()" [disabled]="!canSave()"
        class="px-4 py-2 bg-[#B8672E] text-white rounded-lg hover:bg-[#A67C52] transition flex items-center disabled:opacity-50">
        <lucide-icon [img]="Check" class="w-5 h-5 mr-2" />Guardar Traslado
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- COLUMNA IZQUIERDA -->
    <div class="lg:col-span-2 space-y-6">
      <div class="bg-white rounded-lg border border-[#E5E5E5] shadow-sm p-6">
        <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">Traslado</h2>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 text-sm mb-1">Almacén origen *</label>
            <select [(ngModel)]="model.id_almacen_origen"
              class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#B8672E]">
              <option value="" disabled>Seleccionar origen</option>
              <option *ngFor="let alm of row.almacenes" [value]="alm.id_almacen" [disabled]="alm.cantidad <= 0">
                {{ alm.nombre }} — {{ alm.cantidad }}
              </option>
            </select>
          </div>

          <div>
            <label class="block text-gray-700 text-sm mb-1">Almacén destino *</label>
            <select [(ngModel)]="model.id_almacen_destino"
              class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#B8672E]">
              <option value="" disabled>Seleccionar destino</option>
              <option *ngFor="let alm of almacenesDestino" [value]="alm.id_almacen">{{ alm.nombre }}</option>
            </select>
          </div>

          <div>
            <label class="block text-gray-700 text-sm mb-1">Disponible en origen</label>
            <input type="number" [value]="selectedOrigenCantidad" disabled
              class="w-full bg-[#F9F9F9] border border-[#E5E5E5] rounded-lg px-3 py-2 text-gray-500" />
          </div>

          <div>
            <label class="block text-gray-700 text-sm mb-1">Cantidad a trasladar *</label>
            <input type="number" min="0" [(ngModel)]="model.cantidad" placeholder="Ej: 10"
              class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#B8672E]" />
          </div>

          <div class="col-span-2">
            <label class="block text-gray-700 text-sm mb-1">Motivo</label>
            <textarea [(ngModel)]="model.motivo" rows="3" placeholder="Ej: Reubicación de stock entre almacenes"
              class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#B8672E]"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- COLUMNA DERECHA -->
    <div class="space-y-6">
      <div class="bg-white rounded-lg border border-[#E5E5E5] shadow-sm p-6">
        <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">Entidad</h2>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between">
            <span class="text-gray-500">Tipo</span>
            <span class="font-medium text-[#1F1F1F]">{{ labelTipo(row.tipo) }}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500">ID</span>
            <span class="font-medium text-[#1F1F1F] font-mono">{{ row.id }}</span>
          </div>
          <div class="flex justify-between" *ngIf="row.userId || row.ownedByStore">
            <span class="text-gray-500">Usuario</span>
            <span class="font-medium text-[#1F1F1F]">
              {{ row.ownedByStore ? 'FORTUNATO' : (row.userId | UserNamePipe | async) }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
