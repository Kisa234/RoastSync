<div class="fixed inset-0 bg-opacity-50 backdrop-blur-md  flex items-center justify-center z-10 p-4">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-3xl overflow-visible">

    <!-- Header con pestañas -->
    <div class="flex justify-between items-center px-6 pt-4">
      <div>
        <h2 class="text-xl font-semibold text-[#1F1F1F]">Crear Nuevo Lote</h2>
        <p class="text-gray-600 text-sm">Registra un nuevo lote</p>
      </div>
      <button (click)="onCancel()" class="text-gray-400 hover:text-gray-600">
        <lucide-icon [img]="X" class="w-5 h-5" />
      </button>
    </div>

    <div class="px-6 pt-4">
      <ul class="flex border-b border-[#E5E5E5]">
        <li *ngFor="let t of tabs" class="mr-6">
          <button (click)="selectTab(t.key)" class="pb-2 text-sm font-medium transition"
            [class.border-b-2]="activeTab===t.key" [class.border-[#B8672E]]="activeTab===t.key"
            [class.text-[#1F1F1F]]="activeTab===t.key" [class.text-gray-500]="activeTab!==t.key">
            {{ t.label }}
          </button>
        </li>
      </ul>
    </div>

    <!-- Body -->
    <div class="px-6 py-5">

      <!-- ===================== DESDE MUESTRA ===================== -->
      <form *ngIf="activeTab==='desde-muestra'" class="grid grid-cols-1 sm:grid-cols-3 gap-x-4 gap-y-3">

        <!-- Fila 1: Muestra | Peso | Almacén -->
        <div>
          <label class="block text-gray-700 text-sm mb-1">Muestra *</label>
          <select-search name="muestra" [(ngModel)]="selectedMuestraId" (ngModelChange)="onMuestraChange($event)"
            [items]="muestras" displayField="id_muestra" valueField="id_muestra"
            placeholder="Seleccionar Muestra"></select-search>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Peso (gr) *</label>
          <input type="number" min="1" [(ngModel)]="model.peso" name="peso"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Almacén *</label>
          <select [(ngModel)]="model.almacen" name="almacen" class="w-full appearance-none border border-[#E5E5E5] rounded-lg px-3 py-2
                 focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition">
            <option value="" disabled selected>Selecciona Almacén</option>
            <option *ngFor="let a of almacenes" [value]="a.id_almacen">{{ a.nombre }}</option>
          </select>
        </div>

        <!-- Fila 2: Productor | Finca | Cliente (de la muestra, solo lectura) -->
        <div>
          <label class="block text-gray-700 text-sm mb-1">Productor</label>
          <input type="text" [(ngModel)]="model.productor" name="productor" disabled
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 bg-gray-50 text-gray-600" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Finca</label>
          <input type="text" [(ngModel)]="model.finca" name="finca" disabled
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 bg-gray-50 text-gray-600" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Cliente</label>
          <input type="text" disabled
            [value]="model.owned_by_store ? 'FORTUNATO (Tienda)' : (getClienteNombre(model.id_user) || '—')"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 bg-gray-50 text-gray-600" />
        </div>

        <!-- Fila 3: Departamento | Provincia | Distrito -->
        <div>
          <label class="block text-gray-700 text-sm mb-1">Departamento</label>
          <input type="text" [(ngModel)]="model.departamento" name="departamento" disabled
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 bg-gray-50 text-gray-600" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Provincia</label>
          <select-search name="provincia" [items]="provincias" displayField="nombre" valueField="nombre"
            placeholder="Provincia" [(ngModel)]="model.provincia" [disabled]="!model.departamento">
          </select-search>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Distrito</label>
          <input type="text" [(ngModel)]="model.distrito" name="distrito" disabled
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 bg-gray-50 text-gray-600" />
        </div>

        <!-- Fila 4: Altitud | Año de cosecha | Costo -->
        <div>
          <label class="block text-gray-700 text-sm mb-1" for="altura-muestra">Altitud (msnm)</label>
          <input id="altura-muestra" type="number" min="1" step="1" [(ngModel)]="model.altura" name="altura"
            placeholder="Ej: 1800" class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 placeholder-gray-400
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1" for="anio-muestra">Año de cosecha</label>
          <input id="anio-muestra" type="number" min="2000" [max]="anioMax" step="1" [(ngModel)]="model.anio_cosecha"
            name="anio_cosecha" placeholder="Ej: 2026" class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 placeholder-gray-400
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Costo (PEN)</label>
          <input type="number" min="1" [(ngModel)]="model.costo" name="costo"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <!-- Fila 5: Proceso | Clasificación | Variedades -->
        <div>
          <label class="block text-gray-700 text-sm mb-1">Proceso</label>
          <div class="relative">
            <select [(ngModel)]="model.proceso" name="proceso" disabled class="w-full appearance-none border border-[#E5E5E5] rounded-lg px-3 py-2
                 bg-gray-50 text-gray-600">
              <option value="" disabled selected>Selecciona el proceso</option>
              <option *ngFor="let p of procesos" [value]="p">{{ p }}</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
              <lucide-icon [img]="ChevronDown" class="w-4 h-4 text-gray-400" />
            </div>
          </div>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">
            Clasificación {{ model.owned_by_store ? '*' : '' }}
          </label>
          <div class="relative">
            <select [(ngModel)]="model.clasificacion" name="clasificacion" class="w-full appearance-none border border-[#E5E5E5] rounded-lg px-3 py-2
                 focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition">
              <option value="" disabled selected>Selecciona la clasificación</option>
              <option *ngFor="let c of clasificaciones" [value]="c">{{ c }}</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
              <lucide-icon [img]="ChevronDown" class="w-4 h-4 text-gray-400" />
            </div>
          </div>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Variedades</label>
          <input type="text" [(ngModel)]="model.variedades" name="variedades" disabled
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 bg-gray-50 text-gray-600" />
        </div>

      </form>

      <!-- ===================== MANUAL ===================== -->
      <form *ngIf="activeTab==='manual'" class="grid grid-cols-1 sm:grid-cols-3 gap-x-4 gap-y-3">

        <!-- Fila 1: Productor | Finca | Cliente -->
        <div>
          <label class="block text-gray-700 text-sm mb-1" for="productor">Productor *</label>
          <input id="productor" type="text" [(ngModel)]="model.productor" name="productor" placeholder="Ej: Simon Brown"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 placeholder-gray-400
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1" for="finca">Finca *</label>
          <input id="finca" type="text" [(ngModel)]="model.finca" name="finca" placeholder="Ej: Las Chimoyas"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 placeholder-gray-400
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Cliente / Tienda *</label>
          <select-search name="cliente" [ngModel]="model.id_user ?? ''" (ngModelChange)="onClienteChange($event)"
            [items]="clientesConTienda" displayField="nombre" valueField="id_user"
            placeholder="Seleccionar cliente"></select-search>
        </div>

        <!-- Fila 2: Departamento | Provincia | Distrito -->
        <div>
          <label class="block text-gray-700 text-sm mb-1">Departamento *</label>
          <select-search name="depto" [items]="departamentos" displayField="nombre" valueField="nombre"
            placeholder="Departamento" [(ngModel)]="model.departamento" (ngModelChange)="onDeptoChange($event)">
          </select-search>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Provincia</label>
          <select-search name="provincia" [items]="provincias" displayField="nombre" valueField="nombre"
            placeholder="Provincia" [(ngModel)]="model.provincia" (ngModelChange)="onProvinciaChange($event)"
            [disabled]="!model.departamento">
          </select-search>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Distrito *</label>
          <select-search name="prov" [items]="distritos" displayField="nombre" valueField="nombre"
            placeholder="Distrito" [(ngModel)]="model.distrito" (ngModelChange)="onDistritoChange($event)"
            [disabled]="!model.departamento">
          </select-search>
        </div>

        <!-- Fila 3: Altitud | Año de cosecha | Peso -->
        <div>
          <label class="block text-gray-700 text-sm mb-1" for="altura">Altitud (msnm)</label>
          <input id="altura" type="number" min="1" step="1" [(ngModel)]="model.altura" name="altura" placeholder="Ej: 1800"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 placeholder-gray-400
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1" for="anio_cosecha">Año de cosecha</label>
          <input id="anio_cosecha" type="number" min="2000" [max]="anioMax" step="1" [(ngModel)]="model.anio_cosecha"
            name="anio_cosecha" placeholder="Ej: 2026" class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 placeholder-gray-400
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1" for="peso">Peso (gr) *</label>
          <input id="peso" type="number" min="0" [(ngModel)]="model.peso" name="peso" required
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 placeholder-gray-400
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <!-- Fila 4: Costo | Almacén | Proceso -->
        <div>
          <label class="block text-gray-700 text-sm mb-1">Costo (PEN)</label>
          <input type="number" min="1" [(ngModel)]="model.costo" name="costo"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Almacén *</label>
          <select [(ngModel)]="model.almacen" name="almacen" class="w-full appearance-none border border-[#E5E5E5] rounded-lg px-3 py-2
                 focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition">
            <option value="" disabled selected>Selecciona Almacén</option>
            <option *ngFor="let a of almacenes" [value]="a.id_almacen">{{ a.nombre }}</option>
          </select>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Proceso *</label>
          <div class="relative">
            <select [(ngModel)]="model.proceso" name="proceso" class="w-full appearance-none border border-[#E5E5E5] rounded-lg px-3 py-2
                 focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition">
              <option value="" disabled selected>Selecciona el proceso</option>
              <option *ngFor="let p of procesos" [value]="p">{{ p }}</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
              <lucide-icon [img]="ChevronDown" class="w-4 h-4 text-gray-400" />
            </div>
          </div>
        </div>

        <!-- Fila 5: Variedades (2 col) | Clasificación -->
        <div class="sm:col-span-2">
          <label class="block text-gray-700 text-sm mb-1">Variedades *</label>
          <select-search class="w-full" name="variedades" [(ngModel)]="model.variedades" [items]="variedades"
            displayField="nombre" valueField="nombre" placeholder="Seleccionar variedades"
            [multiple]="true"></select-search>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">
            Clasificación {{ model.owned_by_store ? '*' : '' }}
          </label>
          <div class="relative">
            <select [(ngModel)]="model.clasificacion" name="clasificacion" class="w-full appearance-none border border-[#E5E5E5] rounded-lg px-3 py-2
                 focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition">
              <option value="" disabled selected>Selecciona la clasificación</option>
              <option *ngFor="let c of clasificaciones" [value]="c">{{ c }}</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
              <lucide-icon [img]="ChevronDown" class="w-4 h-4 text-gray-400" />
            </div>
          </div>
        </div>

      </form>

    </div>

    <!-- Footer -->
    <div class="flex justify-end items-center px-6 py-4 border-t border-[#E5E5E5] space-x-2">
      <button (click)="onCancel()" class="px-4 py-2 rounded border border-[#A67C52] hover:bg-[#F3F2F1]">
        Cancelar
      </button>

      <!-- Botón dinámico -->
      <button *ngIf="activeTab==='manual'" (click)="saveManual()"
        class="px-4 py-2 rounded bg-[#B8672E] text-white hover:bg-[#A67C52] flex items-center">
        <lucide-icon [img]="Check" class="w-5 h-5 mr-2" />Guardar
      </button>
      <button *ngIf="activeTab==='desde-muestra'" (click)="saveFromMuestra()" class="px-4 py-2 rounded bg-[#B8672E] text-white hover:bg-[#A67C52]
        disabled:opacity-50 flex items-center" [disabled]="isButtonDisabled()">
        <lucide-icon [img]="Check" class="w-5 h-5 mr-2" />
        Crear Lote
      </button>
    </div>
  </div>
</div>
