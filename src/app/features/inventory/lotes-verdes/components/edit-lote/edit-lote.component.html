<div class="fixed inset-0 bg-opacity-50 backdrop-blur-md  flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-3xl overflow-visible">

    <!-- Header -->
    <div class="flex justify-between items-center px-6 pt-4">
      <div>
        <h2 class="text-xl font-semibold text-[#1F1F1F]">Editar Lote</h2>
        <p class="text-gray-600 text-sm">Edita un lote existente</p>
      </div>
      <button (click)="onCancel()" class="text-gray-400 hover:text-gray-600">
        <lucide-icon [img]="X" class="w-5 h-5" />
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-5">
      <form class="grid grid-cols-1 sm:grid-cols-3 gap-x-4 gap-y-3">

        <!-- Fila 1: Productor | Finca | Cliente -->
        <div>
          <label class="block text-gray-700 text-sm mb-1" for="productor">Productor</label>
          <input id="productor" type="text" [(ngModel)]="model.productor" name="productor" placeholder="Ej: Simon Brown"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 placeholder-gray-400
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1" for="finca">Finca</label>
          <input id="finca" type="text" [(ngModel)]="model.finca" name="finca" placeholder="Ej: Las Chimoyas"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 placeholder-gray-400
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Cliente</label>
          <input type="text" disabled [value]="clienteNombreDisplay"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 bg-gray-50 text-gray-600" />
        </div>

        <!-- Fila 2: Departamento | Provincia | Distrito -->
        <div>
          <label class="block text-gray-700 text-sm mb-1">Departamento</label>
          <select-search name="departamento" [items]="departamentos" displayField="nombre" valueField="nombre"
            placeholder="Departamento" [(ngModel)]="model.departamento" (ngModelChange)="onDeptoChange($event)">
          </select-search>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Provincia</label>
          <select-search name="provincia" [items]="provincias" displayField="nombre" valueField="nombre"
            placeholder="Provincia" [(ngModel)]="model.provincia" (ngModelChange)="onProvinciaChange($event)"
            [disabled]="!model.departamento">
          </select-search>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Distrito</label>
          <select-search name="distrito" [items]="distritos" displayField="nombre" valueField="nombre"
            placeholder="Distrito" [(ngModel)]="model.distrito" (ngModelChange)="onDistritoChange($event)"
            [multiple]="true" [multipleAsString]="true">
          </select-search>
        </div>

        <!-- Fila 3: Altitud | Año de cosecha | Costo -->
        <div>
          <label class="block text-gray-700 text-sm mb-1" for="altura">Altitud (msnm)</label>
          <input id="altura" type="number" min="1" step="1" [(ngModel)]="model.altura" name="altura" placeholder="Ej: 1800"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 placeholder-gray-400
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1" for="anio_cosecha">Año de cosecha</label>
          <input id="anio_cosecha" type="number" min="2000" [max]="anioMax" step="1" [(ngModel)]="model.anio_cosecha"
            name="anio_cosecha" placeholder="Ej: 2026" class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2 placeholder-gray-400
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Costo (PEN)</label>
          <input type="number" min="1" [(ngModel)]="model.costo" name="costo"
            class="w-full border border-[#E5E5E5] rounded-lg px-3 py-2
           focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition" />
        </div>

        <!-- Fila 4: Proceso | Clasificación | Variedades -->
        <div>
          <label class="block text-gray-700 text-sm mb-1">Proceso *</label>
          <div class="relative">
            <select [(ngModel)]="model.proceso" name="proceso" class="w-full appearance-none border border-[#E5E5E5] rounded-lg px-3 py-2
                 focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition">
              <option value="" disabled selected>Selecciona el proceso</option>
              <option *ngFor="let p of procesos" [value]="p">{{ p }}</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
              <lucide-icon [img]="ChevronDown" class="w-4 h-4 text-gray-400" />
            </div>
          </div>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Clasificación *</label>
          <div class="relative">
            <select [(ngModel)]="model.clasificacion" name="clasificacion" class="w-full appearance-none border border-[#E5E5E5] rounded-lg px-3 py-2
                 focus:border-[#B8672E] focus:ring-2 focus:ring-[#B8672E] focus:outline-none transition">
              <option value="" disabled selected>Selecciona la clasificación</option>
              <option *ngFor="let c of clasificaciones" [value]="c">{{ c }}</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
              <lucide-icon [img]="ChevronDown" class="w-4 h-4 text-gray-400" />
            </div>
          </div>
        </div>

        <div>
          <label class="block text-gray-700 text-sm mb-1">Variedades *</label>
          <select-search class="w-full" name="variedades" [(ngModel)]="model.variedades" [items]="variedades"
            displayField="nombre" valueField="nombre" placeholder="Seleccionar variedades"
            [multiple]="true"></select-search>
        </div>

      </form>
    </div>

    <!-- Footer -->
    <div class="flex justify-end items-center px-6 py-4 border-t border-[#E5E5E5] space-x-2">
      <button (click)="onCancel()" class="px-4 py-2 rounded border border-[#A67C52] hover:bg-[#F3F2F1]">
        Cancelar
      </button>
      <button (click)="saveManual()"
        class="px-4 py-2 rounded bg-[#B8672E] text-white hover:bg-[#A67C52] flex items-center">
        <lucide-icon [img]="Check" class="w-5 h-5 mr-2" />Guardar
      </button>
    </div>
  </div>
</div>
