<nav class="h-screen bg-[#30251D] text-white transition-all duration-300 flex flex-col" [ngClass]="{
    'w-64': !collapsed,
    'w-20': collapsed
  }">


  <!-- LOGO -->
  <div class="px-4 py-4 flex items-center" [ngClass]="{'justify-between': !collapsed, 'justify-center': collapsed}">

    <lucide-icon [img]="Flame"></lucide-icon>

    <span class="text-xl font-semibold ml-2 transition-all duration-300" [ngClass]="{
      'opacity-100 w-auto': !collapsed,
      'opacity-0 w-0 overflow-hidden': collapsed
    }">
      ORIGO
    </span>

    <button *ngIf="!collapsed" type="button" (click)="toggleSidebar()"
      class="p-1 rounded hover:bg-white/10 transition ml-auto">
      <lucide-icon [img]="ChevronLeft"></lucide-icon>
    </button>
  </div>

  <!-- MENU -->
  <ul class="flex-1 min-h-0 overflow-y-auto sidebar-scroll px-2 space-y-1">
    <li *ngFor="let item of items">

      <!-- LINK SIMPLE -->
      <ng-container *ngIf="item.type === 'link'">
        <a [routerLink]="collapsed ? null : item.path" (click)="onLinkClick()" routerLinkActive="bg-[#B8672E]/20"
          class="flex items-center px-4 py-3 rounded hover:bg-[#B8672E]/20 transition-all cursor-pointer">
          <lucide-icon [img]="item.icon"></lucide-icon>

          <span class="ml-3 whitespace-nowrap transition-all duration-300" [ngClass]="{
              'opacity-100 w-auto': !collapsed,
              'opacity-0 w-0 overflow-hidden': collapsed
            }">
            {{ item.label }}
          </span>
        </a>
      </ng-container>

      <!-- GRUPO -->
      <ng-container *ngIf="item.type === 'group'">
        <button type="button" (click)="toggleGroup(item.key)"
          class="w-full flex items-center justify-between px-4 py-3 rounded hover:bg-[#B8672E]/20 transition-all"
          [ngClass]="{
            'bg-[#B8672E]/20': isGroupActive(item)
          }">
          <div class="flex items-center">
            <lucide-icon [img]="item.icon"></lucide-icon>

            <span class="ml-3 whitespace-nowrap transition-all duration-300" [ngClass]="{
                'opacity-100 w-auto': !collapsed,
                'opacity-0 w-0 overflow-hidden': collapsed
              }">
              {{ item.label }}
            </span>
          </div>

          <lucide-icon *ngIf="!collapsed" [img]="ChevronDown" class="transition-transform duration-300"
            [class.rotate-180]="openGroups[item.key]"></lucide-icon>
        </button>

        <!-- SUBMENU -->
        <ul *ngIf="openGroups[item.key] && !collapsed" class="mt-1 ml-3 pl-3 border-l border-white/10 space-y-1">
          <li *ngFor="let child of item.children">
            <a [routerLink]="child.path" routerLinkActive="bg-[#B8672E]/20"
              class="flex items-center px-4 py-2 rounded hover:bg-[#B8672E]/20 text-sm transition">
              <lucide-icon [img]="child.icon"></lucide-icon>
              <span class="ml-3">{{ child.label }}</span>
            </a>
          </li>
        </ul>
      </ng-container>

    </li>
  </ul>

  <!-- LOGOUT -->
  <div class="px-2 py-4 border-t border-white/10">
    <button type="button" (click)="logout()"
      class="w-full flex items-center px-4 py-3 rounded text-white hover:bg-red-500/20 hover:text-red-300 transition-all">
      <lucide-icon [img]="LogOut "></lucide-icon>
      <span class="ml-3 whitespace-nowrap transition-all duration-300" [ngClass]="{
          'opacity-100 w-auto': !collapsed,
          'opacity-0 w-0 overflow-hidden': collapsed
        }">
        Cerrar sesión
      </span>
    </button>
  </div>
</nav>
